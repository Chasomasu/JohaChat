# OneBot 连接配置
# adapter: 选择 OneBot 后端，可选 napcat / snowluma（均基于 OneBot 11 正向 WebSocket）
adapter: napcat

napcat:
  ws_url: ws://127.0.0.1:3002
  access_token: ""
  bot_uin: "8888888888"
  root: ""
  webui_uri: http://127.0.0.1:6099
